services:
  - type: web
    name: hiver-support-agent-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false        # Set in Render dashboard
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION_NAME
        value: hiver_support_tweets
      - key: TARGET_BRAND
        value: AppleSupport
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: EMBEDDING_MODEL
        value: all-MiniLM-L6-v2
      - key: RAG_TOP_K
        value: "5"
      - key: ESCALATION_CONFIDENCE_THRESHOLD
        value: "0.65"
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: SQLITE_DB_PATH
        value: /var/data/hiver_agent.db
    disk:
      name: hiver-data
      mountPath: /var/data
      sizeGB: 1
    healthCheckPath: /health
